# Local use only: runs the CI-built image the way the server does. The server
# does not use this file; its compose file is fixed and lives in the latchkey
# repo (deploy/server/host/hackernews-compose.yml), so a push here can change
# the app but never the container's limits there. The limits below mirror it,
# so a local run shows what would break on the server. To build from source
# instead, use docker-compose.dev.yml.
services:
  app:
    # IMAGE_TAG picks a commit's image (its SHA); it defaults to :latest,
    # which is what the server runs.
    image: ghcr.io/tonimelisma/hackernews:${IMAGE_TAG:-latest}
    restart: unless-stopped
    user: "1000:1000"
    environment:
      - NODE_ENV=production
      - SECRET=${SECRET}
      - SQLITE_PATH=/data/hackernews.db
      - PORT=3000
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - sqlite-data:/data
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/v1/stories?timespan=Day&limit=1"]
      interval: 30s
      # 15s, not 5s: the query hits SQLite on a pd-standard disk, and under
      # I/O contention a healthy app exceeded 5s (false "unhealthy").
      timeout: 15s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  sqlite-data:
