services:
  app:
    # Built and pushed by CI (.github/workflows/ci.yml); the VPS only pulls.
    # Never build on the VPS: a build saturates its pd-standard disk and
    # starves the live app (measured 2026-09-29). IMAGE_TAG is the commit SHA
    # set by the deploy job; manual runs fall back to :latest.
    image: ghcr.io/tonimelisma/hackernews:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - SECRET=${SECRET}
      - SQLITE_PATH=/data/hackernews.db
      - PORT=3000
    volumes:
      - sqlite-data:/data
    networks:
      reverse_proxy:
        aliases:
          - hackernews-app
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/v1/stories?timespan=Day&limit=1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  sqlite-data:
networks:
  reverse_proxy:
    external: true
