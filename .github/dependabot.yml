# Keeps the build's pins fresh: action SHAs in .github/workflows and the
# base-image digest in the Dockerfile. npm dependencies are updated by the
# Definition of Done (npx npm-check-updates), not here.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
