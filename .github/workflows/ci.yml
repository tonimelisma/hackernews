name: CI

on:
  pull_request:
    branches: [master]
    # `edited`: a description fixed after the push re-runs the checks that read it. Every job runs
    # on it, so the newest `CI gate` on a commit always reflects all the checks.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [master]
  schedule:
    # Weekly full run on master, off the hour, so rot from new toolchains, base images or
    # advisories shows up. It builds and checks both images but publishes nothing: only pushes
    # to master release. No manual or dispatch triggers: ADR 0002 forbids them.
    - cron: "37 5 * * 3"

permissions:
  contents: read

jobs:
  # actionlint (with shellcheck, preinstalled on the runner) over every
  # workflow. Pinned release, checksum verified.
  workflows:
    runs-on: ubuntu-latest
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint
        run: |
          curl -sSfL -o "$RUNNER_TEMP/actionlint.tgz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/actionlint.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tgz" -C "$RUNNER_TEMP" actionlint

      - name: Lint workflows
        run: '"$RUNNER_TEMP/actionlint"'

  backend-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint backend
        run: npm run lint

      - name: Run backend tests with coverage
        run: npm run test:coverage
        env:
          NODE_ENV: ci

      - name: Upload backend coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-coverage
          path: coverage/
          retention-days: 14

      - name: Run npm audit
        run: npm audit --audit-level=moderate --omit=dev

  frontend-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: hackernews-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: hackernews-frontend

      - name: Lint frontend
        run: npm run lint
        working-directory: hackernews-frontend

      - name: Run frontend tests with coverage
        run: npm run test:coverage
        working-directory: hackernews-frontend

      - name: Upload frontend coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-coverage
          path: hackernews-frontend/coverage/
          retention-days: 14

      - name: Build frontend
        run: npm run build
        working-directory: hackernews-frontend

      - name: Run npm audit
        run: npm audit --audit-level=moderate
        working-directory: hackernews-frontend

  # Every commit's image is built natively for each platform and checked
  # against the runtime contract (scripts/image-smoke.sh). On master the
  # checked image is pushed by digest; `release` then tags and signs it.
  image:
    needs: [workflows, backend-tests, frontend-tests]
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/tonimelisma/hackernews
      PUBLISH: ${{ github.ref == 'refs/heads/master' && github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Platform slug and commit time
        run: |
          echo "SLUG=${PLATFORM//\//-}" >> "$GITHUB_ENV"
          echo "CREATED=$(git log -1 --format=%cI)" >> "$GITHUB_ENV"
        env:
          PLATFORM: ${{ matrix.platform }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pull requests: build into the local daemon only.
      - name: Build (not published)
        if: env.PUBLISH != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: hackernews:candidate
          cache-from: type=gha,scope=${{ env.SLUG }}

      # master: push untagged, by digest, with provenance and an SBOM. Nobody
      # pulling a tag sees it until `release` has tagged and signed it.
      - name: Build and push by digest
        id: push
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.title=hackernews
            org.opencontainers.image.description=Hacker News top stories by timespan, with per-user hiding
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.sha }}
            org.opencontainers.image.created=${{ env.CREATED }}
          cache-from: type=gha,scope=${{ env.SLUG }}
          cache-to: type=gha,scope=${{ env.SLUG }},mode=max

      - name: Pull the pushed image
        if: env.PUBLISH == 'true'
        run: |
          docker pull "$IMAGE@$DIGEST"
          docker tag "$IMAGE@$DIGEST" hackernews:candidate
        env:
          DIGEST: ${{ steps.push.outputs.digest }}

      - name: Check the runtime contract
        run: scripts/image-smoke.sh hackernews:candidate

      - name: Record digest
        if: env.PUBLISH == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.push.outputs.digest }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: env.PUBLISH == 'true'
        with:
          name: digest-${{ env.SLUG }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # A release = every green master commit: one multi-arch index tagged :<sha>
  # (immutable) and :latest (moving), signed keylessly with cosign (Sigstore,
  # GitHub OIDC). id-token is only for that signature; no other credential
  # exists and nothing here talks to anything but the registry.
  release:
    needs: [image]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      IMAGE: ghcr.io/tonimelisma/hackernews
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      # :latest must stay in the tags: hosts that track releases pull it.
      - name: Tag the multi-arch index
        working-directory: ${{ runner.temp }}/digests
        run: |
          sources=()
          for d in *; do sources+=("$IMAGE@sha256:$d"); done
          [ "${#sources[@]}" -eq 2 ] || { echo "::error::expected 2 platform digests, got ${#sources[@]}"; exit 1; }
          docker buildx imagetools create -t "$IMAGE:$GITHUB_SHA" -t "$IMAGE:latest" "${sources[@]}"
          digest=$(docker buildx imagetools inspect "$IMAGE:$GITHUB_SHA" --format '{{json .Manifest}}' | jq -r .digest)
          echo "DIGEST=$digest" >> "$GITHUB_ENV"

      - name: Sign the release
        run: cosign sign --yes "$IMAGE@$DIGEST"

      - name: Verify the signature like a host would
        run: |
          cosign verify "$IMAGE:$GITHUB_SHA" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/ci.yml@refs/heads/master" > /dev/null
          echo "Released $IMAGE:$GITHUB_SHA ($DIGEST), also :latest; signature verified." >> "$GITHUB_STEP_SUMMARY"

  # Requirements, Validates tags and doc links agree; on PRs, the description has every section.
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # pr-check diffs the pull request's base and head
          persist-credentials: false
      - name: process-check
        run: script/process-check
      - name: pr-check
        if: github.event_name == 'pull_request'
        run: script/pr-check

  # The one required status check. It needs every other job and passes only when each of them
  # succeeded or was skipped (release is skipped outside pushes to master), so a cancelled or
  # failed job can never be merged around.
  gate:
    name: CI gate
    if: always()
    needs: [workflows, backend-tests, frontend-tests, image, release, process]
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' >/dev/null
