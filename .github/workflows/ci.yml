name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint backend
        run: npm run lint

      - name: Run backend tests with coverage
        run: npm run test:coverage
        env:
          NODE_ENV: ci

      - name: Upload backend coverage
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: coverage/
          retention-days: 14

      - name: Run npm audit
        run: npm audit --audit-level=moderate --omit=dev

  frontend-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: hackernews-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: hackernews-frontend

      - name: Lint frontend
        run: npm run lint
        working-directory: hackernews-frontend

      - name: Run frontend tests with coverage
        run: npm run test:coverage
        working-directory: hackernews-frontend

      - name: Upload frontend coverage
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: hackernews-frontend/coverage/
          retention-days: 14

      - name: Build frontend
        run: npm run build
        working-directory: hackernews-frontend

      - name: Run npm audit
        run: npm audit --audit-level=moderate
        working-directory: hackernews-frontend

  image:
    needs: [backend-tests, frontend-tests]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build here, not on the VPS: an on-box build saturated its pd-standard
      # disk (94% util, 88% iowait) and died with the SSH session (2026-09-29).
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/tonimelisma/hackernews:${{ github.sha }}
            ghcr.io/tonimelisma/hackernews:latest
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [image]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    concurrency: production-deploy
    permissions:
      packages: read
    steps:
      - uses: appleboy/ssh-action@v1.2.5
        env:
          IMAGE_TAG: ${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          # This job's short-lived token: pulls the private package, then is
          # logged out; nothing long-lived is stored on the VPS.
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: 34.45.72.52
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: IMAGE_TAG,GHCR_USER,GHCR_TOKEN
          command_timeout: 20m
          script: |
            set -e
            cd /opt/hackernews
            git pull --ff-only origin master
            docker network inspect reverse_proxy >/dev/null
            export IMAGE_TAG

            # Pull the CI-built image (no building on the VPS)
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose pull app
            docker logout ghcr.io

            # Remember the running image for rollback
            PREV_IMAGE=$(docker inspect --format='{{.Config.Image}}' hackernews-app-1 2>/dev/null || true)

            docker compose up -d --remove-orphans

            # Wait for health check (up to 90s)
            echo "Waiting for health check..."
            for i in $(seq 1 18); do
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' hackernews-app-1 2>/dev/null || echo "missing")
              if [ "$STATUS" = "healthy" ]; then
                echo "Health check passed"
                docker compose ps
                # Drop unused images older than a week (keeps recent rollback targets)
                docker image prune -af --filter until=168h
                exit 0
              fi
              echo "  attempt $i: $STATUS"
              sleep 5
            done

            # Health check failed — roll back to the previously running image
            echo "HEALTH CHECK FAILED — rolling back to $PREV_IMAGE"
            if [ -n "$PREV_IMAGE" ]; then
              docker tag "$PREV_IMAGE" ghcr.io/tonimelisma/hackernews:rollback
              IMAGE_TAG=rollback docker compose up -d --remove-orphans
            fi
            docker compose ps
            exit 1
