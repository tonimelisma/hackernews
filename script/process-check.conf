# Settings for script/process-check and script/pr-check. One `key = value` per line; lists are
# space-separated globs (* and ? stay inside a path segment, ** crosses segments, a leading **/
# also matches the root). Keys left out take the defaults.

# Requirement IDs, as a Python regex. Declared in docs/requirements.md as `- **<ID>** ...`.
id_regex = HN-[0-9]{3}

# Files that declare requirements.
requirements = docs/requirements*.md

# Test files. pr-check requires a `fix` PR to touch one.
tests = tests/**/*.test.js hackernews-frontend/src/**/*.test.js hackernews-frontend/src/**/*.test.jsx

# Files searched for `Validates: <ID>` tags: the tests, plus the image smoke test CI runs on every
# image (a validator, not a test file, so a `fix` PR cannot satisfy pr-check by touching it).
validates = tests/**/*.test.js hackernews-frontend/src/**/*.test.js hackernews-frontend/src/**/*.test.jsx scripts/image-smoke.sh

# Docs whose relative links and cited paths must resolve.
docs = CLAUDE.md README.md docs/**/*.md

# A backticked name without a slash counts as a cited file when it has one of these extensions;
# it must then be the name of some file in the repository.
cited_exts = md js jsx sh yml yaml json

# Regexes for backticked text that looks like a path but is not one in this repository.
ignore_paths = NNNN NNN- ^(\./)?services/[A-Za-z]+$ hackernews-frontend/build/
